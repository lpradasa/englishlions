<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabador de Voz</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .recorder-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.4em;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        /* Bot車n de grabaci車n limpio con Start / Stop */
        .record-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e74c3c;
            border: none;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
        }
        .record-btn:hover {
            transform: scale(1.05);
            background-color: #c0392b;
        }
        .record-btn.recording {
            background-color: #27ae60;
            box-shadow: 0 0 0 10px rgba(39, 174, 96, 0.2);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .status-text {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            font-size: 1em;
        }
        .audio-player-container {
            margin-top: 15px;
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 8px;
        }
        .actions-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }
        .btn-action {
            background-color: #ecf0f1;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9em;
        }
        .btn-action:hover {
            background-color: #bdc3c7;
        }
        .btn-download {
            background-color: #2980b9;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-download:hover {
            background-color: #2471a3;
        }
        .error-msg {
            color: #c0392b;
            font-size: 0.85em;
            margin-top: 12px;
            display: none;
            background: #fadbd8;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.4em;
        }
    </style>
</head>
<body>

<div class="recorder-card">
    <h2>Voice Recorder</h2>
    <p class="subtitle">Click the button to start recording</p>

    <!-- Bot車n con icono limpio y texto Start/Stop sin interrogantes -->
    <button class="record-btn" id="recordBtn" onclick="toggleRecording()" title="Start / Stop">
        <span style="font-size: 1.2em;">??</span>
        <span id="btnText">Start</span>
    </button>
    
    <div class="status-text" id="statusText">Ready</div>

    <div class="audio-player-container" id="playerContainer">
        <p style="margin: 0; font-size: 0.85em; color: #555;">Your recording:</p>
        <audio id="audioPlayback" controls></audio>
        
        <div class="actions-container">
            <button class="btn-action" onclick="resetRecording()">Record Again</button>
            <a id="downloadBtn" class="btn-action btn-download" download="recording.mp3">Download MP3</a>
        </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById("recordBtn");
    const btnText = document.getElementById("btnText");
    const statusText = document.getElementById("statusText");
    const playerContainer = document.getElementById("playerContainer");
    const audioPlayback = document.getElementById("audioPlayback");
    const downloadBtn = document.getElementById("downloadBtn");
    const errorMsg = document.getElementById("errorMsg");

    async function toggleRecording() {
        errorMsg.style.display = "none";

        if (!isRecording) {
            audioChunks = [];
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("API not supported");
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    audioPlayback.src = audioUrl;
                    downloadBtn.href = audioUrl;
                    playerContainer.style.display = "block";
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add("recording");
                btnText.textContent = "Stop";
                statusText.textContent = "Recording...";
                playerContainer.style.display = "none";

            } catch (err) {
                console.error("Error al acceder al micr車fono:", err);
                errorMsg.style.display = "block";
                errorMsg.innerHTML = "<strong>Microphone access needed.</strong><br>Please ensure your browser allows microphone usage.";
            }
        } else {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            
            isRecording = false;
            recordBtn.classList.remove("recording");
            btnText.textContent = "Start";
            statusText.textContent = "Recording ready!";
        }
    }

    function resetRecording() {
        playerContainer.style.display = "none";
        statusText.textContent = "Ready";
        btnText.textContent = "Start";
        audioPlayback.src = "";
        downloadBtn.href = "#";
    }
</script>

</body>
</html>
